<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16181d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TR Board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFE600'/%3E%3Crect x='6' y='7' width='6' height='18' rx='1.5' fill='%23111'/%3E%3Crect x='14' y='7' width='6' height='12' rx='1.5' fill='%23111'/%3E%3Crect x='22' y='7' width='6' height='15' rx='1.5' fill='%23111'/%3E%3C/svg%3E" />
    <script>
      // pre-hydration theme, no flash
      const t = localStorage.getItem("trboard-theme") ?? "system";
      const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
